name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build shareable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp source provenance for native diagnostics
        run: |
          set -euo pipefail
          cat > lib/build-stamp.ts <<EOF
          /** Generated by GitHub Actions for APK provenance diagnostics. */
          export const BUILD_STAMP = {
            commit: "${GITHUB_SHA:0:7}",
            run: "${GITHUB_RUN_NUMBER}",
            builtAt: "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          } as const;
          EOF

      - name: Verify the checked-in Android project
        run: test -f android/gradlew && test -f android/app/build.gradle

      - name: Restore persistent signing keystore
        env:
          AGILITE_KEYSTORE_BASE64: ${{ secrets.AGILITE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$AGILITE_KEYSTORE_BASE64" ]; then
            echo "AGILITE_KEYSTORE_BASE64 is not configured in repository Actions secrets." >&2
            exit 1
          fi
          printf '%s' "$AGILITE_KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
          chmod 600 android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Bundle current JavaScript for Android
        working-directory: android
        run: |
          ./gradlew :app:createBundleReleaseJsAndAssets --no-daemon --stacktrace --console=plain --max-workers=2
          BUNDLE=$(find app/build/generated app/build/intermediates -type f -name index.android.bundle -print -quit)
          test -n "$BUNDLE"
          grep -q "${GITHUB_SHA:0:7}" "$BUNDLE"
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx1536m

      - name: Build bundled release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --console=plain --max-workers=2
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx1536m

      - name: Name APK with version and workflow run
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*version: "\([^" ]*\)".*/\1/p' app.config.ts | head -1)
          APK_NAME="AgiliteTracker-${VERSION}-build-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agilite-collection-tracker-release-apk
          path: android/app/build/outputs/apk/release/${{ env.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Generate automated release notes
        id: release-meta
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*version: "\([^" ]*\)".*/\1/p' app.config.ts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode: \([0-9]*\).*/\1/p' app.config.ts | head -1)
          PACKAGE=$(sed -n "s/.*applicationId '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          TAG="agilite-tracker-v${VERSION}-build-${GITHUB_RUN_NUMBER}"
          APK_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${apk_name}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          {
            echo "# Agilite Tracker ${VERSION}"
            echo
            echo "Direct Android APK for personal use."
            echo
            echo "| Build field | Value |"
            echo "|---|---|"
            echo "| App version | ${VERSION} |"
            echo "| Android versionCode | ${VERSION_CODE} |"
            echo "| Package | ${PACKAGE} |"
            echo "| Signing status | Persistent repository signing enabled |"
            echo "| Target ABI | arm64-v8a |"
            echo "| Commit | [${GITHUB_SHA:0:7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| Workflow run | [Run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo
            echo "**Direct download:** [${apk_name}](${APK_URL})"
            echo
            echo "## Changes in this release"
            echo
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" { in_section=1; print; next }
              in_section && /^## \[/ { exit }
              in_section { print }
            ' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agilite-tracker-v${{ steps.release-meta.outputs.version }}-build-${{ github.run_number }}
          name: Agilite Tracker ${{ steps.release-meta.outputs.version }} (Build ${{ github.run_number }})
          body_path: release-notes.md
          files: android/app/build/outputs/apk/release/${{ env.apk_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write direct download URL
        run: |
          echo "https://github.com/${{ github.repository }}/releases/download/agilite-tracker-v${{ steps.release-meta.outputs.version }}-build-${{ github.run_number }}/${{ env.apk_name }}" > direct-apk-url.txt
          cat direct-apk-url.txt

      - name: Upload direct URL note
        uses: actions/upload-artifact@v4
        with:
          name: agilite-tracker-direct-download-link
          path: direct-apk-url.txt
          retention-days: 30

      - name: Summarize release link
        run: |
          {
            echo "### Direct APK download"
            echo "https://github.com/${{ github.repository }}/releases/download/agilite-tracker-v${{ steps.release-meta.outputs.version }}-build-${{ github.run_number }}/${{ env.apk_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

  validate-native-android:
    name: Validate APK in Android emulator
    needs: build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download the exact APK artifact
        uses: actions/download-artifact@v4
        with:
          name: agilite-collection-tracker-release-apk
          path: emulator-apk

      - name: Run APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            APK=$(find emulator-apk -type f -name '*.apk' -print -quit)
            test -n "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.app.agilitecollectiontracker
            adb shell monkey -p com.app.agilitecollectiontracker 1
            sleep 5
            adb exec-out screencap -p > native-dashboard.png

      - name: Upload native emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: agilite-tracker-native-dashboard-screenshot
          path: native-dashboard.png
          if-no-files-found: error
          retention-days: 30
