name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build shareable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the checked-in Android project
        run: test -f android/gradlew && test -f android/app/build.gradle

      - name: Restore persistent signing keystore
        env:
          AGILITE_KEYSTORE_BASE64: ${{ secrets.AGILITE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$AGILITE_KEYSTORE_BASE64" ]; then
            echo "AGILITE_KEYSTORE_BASE64 is not configured in repository Actions secrets." >&2
            exit 1
          fi
          printf '%s' "$AGILITE_KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
          chmod 600 android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build bundled release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --console=plain --max-workers=2
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx1536m

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agilite-collection-tracker-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate automated release notes
        id: release-meta
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*version: "\([^" ]*\)".*/\1/p' app.config.ts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode: \([0-9]*\).*/\1/p' app.config.ts | head -1)
          PACKAGE=$(sed -n "s/.*applicationId '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          TAG="agilite-tracker-v${VERSION}-build-${GITHUB_RUN_NUMBER}"
          APK_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          {
            echo "# Agilite Tracker ${VERSION}"
            echo
            echo "Direct Android APK for personal use."
            echo
            echo "| Build field | Value |"
            echo "|---|---|"
            echo "| App version | ${VERSION} |"
            echo "| Android versionCode | ${VERSION_CODE} |"
            echo "| Package | ${PACKAGE} |"
            echo "| Signing status | Persistent repository signing enabled |"
            echo "| Target ABI | arm64-v8a |"
            echo "| Commit | [${GITHUB_SHA:0:7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| Workflow run | [Run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo
            echo "**Direct download:** [app-release.apk](${APK_URL})"
            echo
            echo "## Changes in this release"
            echo
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" { in_section=1; print; next }
              in_section && /^## \[/ { exit }
              in_section { print }
            ' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agilite-tracker-v${{ steps.release-meta.outputs.version }}-build-${{ github.run_number }}
          name: Agilite Tracker ${{ steps.release-meta.outputs.version }} (Build ${{ github.run_number }})
          body_path: release-notes.md
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write direct download URL
        run: |
          echo "https://github.com/${{ github.repository }}/releases/download/agilite-tracker-v${{ steps.release-meta.outputs.version }}-build-${{ github.run_number }}/app-release.apk" > direct-apk-url.txt
          cat direct-apk-url.txt

      - name: Upload direct URL note
        uses: actions/upload-artifact@v4
        with:
          name: agilite-tracker-direct-download-link
          path: direct-apk-url.txt
          retention-days: 30

      - name: Summarize release link
        run: |
          {
            echo "### Direct APK download"
            echo "https://github.com/${{ github.repository }}/releases/download/agilite-tracker-v${{ steps.release-meta.outputs.version }}-build-${{ github.run_number }}/app-release.apk"
          } >> "$GITHUB_STEP_SUMMARY"
