name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build shareable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the checked-in Android project
        run: test -f android/gradlew && test -f android/app/build.gradle

      - name: Create ephemeral debug keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -storepass android \
              -keypass android \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build bundled release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --console=plain --max-workers=2
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx1536m

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agilite-collection-tracker-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agilite-tracker-v1.0.5-build-${{ github.run_number }}
          name: Agilite Tracker 1.0.5 (Build ${{ github.run_number }})
          body: |
            Direct Android APK for personal use.

            - Download `app-release.apk` below; it is not wrapped in a ZIP.
            - Target ABI: arm64-v8a.
            - Package: `com.app.agilitecollectiontracker`.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write direct download URL
        run: |
          echo "https://github.com/${{ github.repository }}/releases/download/agilite-tracker-v1.0.5-build-${{ github.run_number }}/app-release.apk" > direct-apk-url.txt
          cat direct-apk-url.txt

      - name: Upload direct URL note
        uses: actions/upload-artifact@v4
        with:
          name: agilite-tracker-direct-download-link
          path: direct-apk-url.txt
          retention-days: 30

      - name: Summarize release link
        run: |
          {
            echo "### Direct APK download"
            echo "https://github.com/${{ github.repository }}/releases/download/agilite-tracker-v1.0.5-build-${{ github.run_number }}/app-release.apk"
          } >> "$GITHUB_STEP_SUMMARY"
